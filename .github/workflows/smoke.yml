name: smoke

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  retrieval-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_vedic_pipeline.txt

      - name: Install deps (API + embeddings, CPU)
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov
          # torch CPU first to avoid huge CUDA wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements_vedic_pipeline.txt
          pip install -e .

      - name: Lint Python with Ruff
        run: ruff check .

      - name: Audit Python dependencies (informational)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements-api.txt
          pip-audit -r requirements_vedic_pipeline.txt

      - name: Unit and API regressions
        run: pytest -v

      - name: Bootstrap mini corpus + index
        run: |
          python -m vedic_pipeline ingest --manifest fixtures/sources_vedic_corpus.json
          python -m vedic_pipeline dedupe
          python -m vedic_pipeline build-index --backend numpy --chunk-size 1000 --overlap 150 --batch-size 32

      - name: Smoke RAG (strict, fixtures gold set)
        env:
          # force numpy path in CI (no postgres)
          DATABASE_URL: ""
        run: |
          python scripts/smoke_rag.py \
            --backend numpy \
            --queries fixtures/smoke_queries_ci.json \
            --strict \
            --json-out data/smoke_report.json

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: data/smoke_report.json

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm test
      - run: npm run build
