# Docker Compose de Produção — Veda Knowledge
# Uso:
#   docker compose -f docker-compose.prod.yml --profile ingress up -d
#
# O Caddy (ingresso/HTTPS) está no perfil "ingress": use --profile ingress para
# subir a stack completa com TLS. Sem o perfil, apenas db + api sobem.
#
# Perfis opcionais:
#   --profile s3       MinIO interno (raw + artefatos; sem portas públicas)
#   --profile train    worker de treino/pipeline (imagem completa, uso via `run`)
#   --profile metrics  Prometheus interno (scrape /metrics; sem porta pública)
#
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vedas-prod-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vedas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-vedas}
    volumes:
      - vedas_prod_pgdata:/var/lib/postgresql/data
    networks:
      - vedas_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vedas} -d ${POSTGRES_DB:-vedas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G

  api:
    image: ${VEDAS_IMAGE:-ghcr.io/leanderdulac/vedas:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vedas-prod-api
    restart: always
    user: "10001:10001"
    environment:
      # NOTA: senha com caracteres especiais exige URL-encode — prefira gerar
      # POSTGRES_PASSWORD alfanumérico longo (ex.: openssl rand -hex 24).
      DATABASE_URL: postgresql://${POSTGRES_USER:-vedas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vedas}
      VEDIC_PIPELINE_API_TOKEN: ${VEDIC_PIPELINE_API_TOKEN:-}
      VEDIC_GENERATION_API_TOKEN: ${VEDIC_GENERATION_API_TOKEN:-}
      VEDIC_REQUIRE_GENERATION_TOKEN: ${VEDIC_REQUIRE_GENERATION_TOKEN:-true}
      VEDIC_ENABLE_RERANKER: ${VEDIC_ENABLE_RERANKER:-false}
      VEDIC_RERANKER_MODEL: ${VEDIC_RERANKER_MODEL:-}
      VEDIC_API_INDEX_DIR: /app/artifacts/embeddings
      VEDIC_LOG_FORMAT: json
      VEDIC_TRUST_PROXY_HEADERS: "true"
      VEDIC_RATE_LIMIT_PER_MINUTE: ${VEDIC_RATE_LIMIT_PER_MINUTE:-120}
      VEDIC_JOBS_DIR: /app/data/jobs
      VEDIC_JOBS_RESTORE: "true"
      VEDIC_EMBEDDING_DIM: ${VEDIC_EMBEDDING_DIM:-384}
      VEDIC_S3_BUCKET: ${VEDIC_S3_BUCKET:-}
      VEDIC_S3_ENDPOINT: ${VEDIC_S3_ENDPOINT:-}
      VEDIC_S3_PREFIX: ${VEDIC_S3_PREFIX:-}
      VEDIC_S3_REGION: ${VEDIC_S3_REGION:-us-east-1}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-grok-4.5}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.x.ai/v1}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://vedas.local,http://localhost:8000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    volumes:
      - vedas_prod_data:/app/data
      - vedas_prod_artifacts:/app/artifacts
    networks:
      - vedas_internal
      - vedas_public
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 3G

  caddy:
    image: caddy:2-alpine
    container_name: vedas-prod-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-vedas.local}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - vedas_public
    depends_on:
      - api
    profiles:
      - ingress

  minio:
    image: minio/minio:latest
    container_name: vedas-prod-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      # Obrigatórias quando o perfil `s3` está ativo (sem default por segurança).
      # Defaults vazios aqui para não quebrar `up` sem o perfil (interpolação
      # do compose avalia todos os serviços); o MinIO recusa subir sem elas.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - vedas_prod_minio:/data
    networks:
      - vedas_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
    profiles:
      - s3

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: vedas-prod-prometheus
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - vedas_prod_prometheus:/prometheus
    networks:
      - vedas_internal
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    profiles:
      - metrics

  train:
    build:
      context: .
      dockerfile: Dockerfile.train
    image: ${VEDAS_TRAIN_IMAGE:-ghcr.io/leanderdulac/vedas-train:latest}
    container_name: vedas-prod-train
    restart: "no"
    user: "10001:10001"
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vedas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vedas}
      VEDIC_API_INDEX_DIR: /app/artifacts/embeddings
      VEDIC_EMBEDDING_DIM: ${VEDIC_EMBEDDING_DIM:-384}
      VEDIC_S3_BUCKET: ${VEDIC_S3_BUCKET:-}
      VEDIC_S3_ENDPOINT: ${VEDIC_S3_ENDPOINT:-http://minio:9000}
      VEDIC_S3_PREFIX: ${VEDIC_S3_PREFIX:-}
      VEDIC_LOG_FORMAT: json
      HF_HOME: /app/artifacts/huggingface
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - vedas_prod_data:/app/data
      - vedas_prod_artifacts:/app/artifacts
    networks:
      - vedas_internal
    deploy:
      resources:
        limits:
          memory: 8G
    profiles:
      - train

networks:
  vedas_internal:
    internal: true
  vedas_public:

volumes:
  vedas_prod_pgdata:
  vedas_prod_data:
  vedas_prod_artifacts:
  vedas_prod_minio:
  vedas_prod_prometheus:
  caddy_data:
  caddy_config:
