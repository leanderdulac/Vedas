[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veda-knowledge"
version = "2.0.0"
description = "Aplicação full-stack de conhecimento védico: biblioteca, busca semântica, Q&A RAG e pipeline de dados."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pypdf>=4.0.0",
    "ebooklib>=0.18",
    "html2text>=2024.2.26",
    "sentence-transformers>=2.3.0",
    "numpy>=1.26.0",
    "openai>=1.40.0",
    "tqdm>=4.66.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
db = [
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.3.0",
]
s3 = [
    "boto3>=1.28.0",
]
train = [
    "tokenizers>=0.15.0",
    "transformers>=4.38.0",
    "datasets>=2.16.0",
    "accelerate>=0.27.0",
    "torch>=2.1.0",
    "sentencepiece>=0.1.99",
]
all = [
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.3.0",
    "boto3>=1.28.0",
    "tokenizers>=0.15.0",
    "transformers>=4.38.0",
    "datasets>=2.16.0",
    "accelerate>=0.27.0",
    "torch>=2.1.0",
    "sentencepiece>=0.1.99",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
vedic-pipeline = "vedic_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["vedic_pipeline*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "UP017"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
